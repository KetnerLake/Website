<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Ketner Lake</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <style>
    html {
      height: 100%;
    }

    body {
      background-image: url( /assets/concepts/lake.jpg );
      background-position: center 25%;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      flex-direction: column;
      font-family: 'Open Sans', sans-serif;
      font-size: 16px;
      font-weight: 400;
      height: 100%;
      margin: 0;
      overflow: hidden;
      padding: 0;
    }

    h1 {
      color: #f4f4f4;
      font-size: 48px;
      font-weight: 400;
      margin: 0;
      padding: 0;
      text-align: center;
      text-shadow: 0 0 10px rgba(30, 96, 156, 0.5);      
    }

    h1 span {
      font-weight: 700;
    }

    h2 {
      color: #f4f4f4;
      font-size: 24px;
      font-weight: 400;
      margin: 0;
      padding: 16px;
    }

    h3 {
      color: #f4f4f4;
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      padding: 0;
    }

    footer {
      display: flex;
      flex-direction: row;
      gap: 32px;
      padding: 0 32px 0 32px;
    }

    footer section {
      background: rgba( 255, 255, 255, 0.20 );
      backdrop-filter: blur( 5px ) brightness( 90% );
      border: solid 1px rgba( 255, 255, 255, 0.20 );
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      display: flex;
      flex-basis: 0;
      flex-direction: column;
      flex-grow: 1;
      height: 400px;
      justify-content: flex-end;
    }

    footer section article {
      background: #ffffff;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      box-shadow: 0 -1px 5px rgba(0, 0, 0, 0.3);
      flex-basis: 0;
      flex-grow: 1;
      margin: 0 16px 0 16px;
    }

    body > section {
      align-items: center;
      display: flex;
      flex-basis: 0;
      flex-grow: 1;
      justify-content: center;
    }
  </style>

<body>

<header>
  <h3>Ketner Lake</h3>
</header>

<section>
  <h1>The intersection of <span>design</span>, <span>development</span>, and <span>you</span>.</h1>
</section>

<footer>
  <section>
    <h2>Technical Leadership</h2>
    <article></article>
  </section>
  <section>
    <h2>Product Strategy</h2>
    <article></article>    
  </section>
  <section>
    <h2>Artificial Intelligence (AI)</h2>
    <article></article>    
  </section>
</footer>

</body>
</html>
