<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Ketner Lake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #fafafa;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: white;
      padding: 60px 0;
      text-align: center;
    }

    .header h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .nav-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      transition: all 0.2s;
    }

    .nav-link:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.6);
    }

    /* Contact Form Section */
    .contact-form {
      padding: 80px 0;
      background: white;
    }

    .form-container {
      max-width: 800px;
      margin: 0 auto;
      background: #f8f9fa;
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .form-intro {
      text-align: center;
      margin-bottom: 40px;
    }

    .form-intro h2 {
      font-size: 2.2rem;
      color: #1a1a1a;
      margin-bottom: 15px;
    }

    .form-intro p {
      font-size: 1.1rem;
      color: #666;
    }

    .contact-form-element {
      margin-bottom: 25px;
    }

    .contact-form label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #1a1a1a;
      font-size: 1rem;
    }

    .contact-form input,
    .contact-form select,
    .contact-form textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: white;
    }

    .contact-form input:focus,
    .contact-form select:focus,
    .contact-form textarea:focus {
      outline: none;
      border-color: #1a1a1a;
      box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
    }

    .contact-form textarea {
      resize: vertical;
      min-height: 120px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .submit-button {
      background: linear-gradient(45deg, #1a1a1a, #333);
      color: white;
      padding: 15px 40px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .submit-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      background: linear-gradient(45deg, #333, #555);
    }

    .submit-button:active {
      transform: translateY(0);
    }

    /* Project Types Grid */
    .project-types {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .project-type {
      display: flex;
      align-items: center;
    }

    .project-type input[type="checkbox"] {
      width: auto;
      margin-right: 10px;
      transform: scale(1.2);
    }

    .project-type label {
      margin-bottom: 0;
      font-weight: 500;
      cursor: pointer;
    }

    /* Success/Error Messages */
    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    /* Footer */
    .footer {
      background: #1a1a1a;
      color: white;
      text-align: center;
      padding: 30px 0;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .header {
        position: relative;
        padding-top: 80px;
      }

      .nav-link {
        position: static;
        display: inline-block;
        margin-bottom: 20px;
      }

      .header h1 {
        font-size: 2.2rem;
      }

      .form-container {
        padding: 30px 20px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .project-types {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <section class="header">
    <a href="landing.html" class="nav-link">← Back to Home</a>
    <div class="container">
      <h1>Get in Touch</h1>
      <p>Let's discuss your project and bring your vision to reality</p>
    </div>
  </section>

  <!-- Contact Form -->
  <section class="contact-form">
    <div class="container">
      <div class="form-container">
        <div class="form-intro">
          <h2>Start Your Project</h2>
          <p>Tell us about your project and we'll get back to you within 24 hours.</p>
        </div>

        <div id="message" class="message"></div>

        <form id="contactForm" action="/api/message" method="POST">
          <div class="form-row">
            <div class="contact-form-element">
              <label for="firstName">First Name *</label>
              <input type="text" id="firstName" name="firstName" required>
            </div>
            <div class="contact-form-element">
              <label for="lastName">Last Name *</label>
              <input type="text" id="lastName" name="lastName" required>
            </div>
          </div>

          <div class="form-row">
            <div class="contact-form-element">
              <label for="email">Email Address *</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="contact-form-element">
              <label for="company">Company/Organization</label>
              <input type="text" id="company" name="company">
            </div>
          </div>

          <div class="contact-form-element">
            <label for="projectType">What type of project are you interested in? *</label>
            <select id="projectType" name="projectType" required>
              <option value="">Select a project type</option>
              <option value="web-application">Web Application</option>
              <option value="mobile-app">Mobile Application</option>
              <option value="api-development">API Development</option>
              <option value="ai-integration">AI Integration</option>
              <option value="system-integration">System Integration</option>
              <option value="cloud-solutions">Cloud Solutions</option>
              <option value="consulting">Technical Consulting</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="contact-form-element">
            <label>Additional services you might need:</label>
            <div class="project-types">
              <div class="project-type">
                <input type="checkbox" id="uiux" name="services[]" value="ui-ux-design">
                <label for="uiux">UI/UX Design</label>
              </div>
              <div class="project-type">
                <input type="checkbox" id="database" name="services[]" value="database-design">
                <label for="database">Database Design</label>
              </div>
              <div class="project-type">
                <input type="checkbox" id="deployment" name="services[]" value="deployment">
                <label for="deployment">Deployment & Hosting</label>
              </div>
              <div class="project-type">
                <input type="checkbox" id="maintenance" name="services[]" value="maintenance">
                <label for="maintenance">Ongoing Maintenance</label>
              </div>
              <div class="project-type">
                <input type="checkbox" id="testing" name="services[]" value="testing">
                <label for="testing">Testing & QA</label>
              </div>
              <div class="project-type">
                <input type="checkbox" id="training" name="services[]" value="training">
                <label for="training">Team Training</label>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="contact-form-element">
              <label for="budget">Estimated Budget</label>
              <select id="budget" name="budget">
                <option value="">Select budget range</option>
                <option value="under-10k">Under $10,000</option>
                <option value="10k-25k">$10,000 - $25,000</option>
                <option value="25k-50k">$25,000 - $50,000</option>
                <option value="50k-100k">$50,000 - $100,000</option>
                <option value="over-100k">Over $100,000</option>
                <option value="discuss">Prefer to discuss</option>
              </select>
            </div>
            <div class="contact-form-element">
              <label for="timeline">Desired Timeline</label>
              <select id="timeline" name="timeline">
                <option value="">Select timeline</option>
                <option value="asap">ASAP</option>
                <option value="1-3-months">1-3 months</option>
                <option value="3-6-months">3-6 months</option>
                <option value="6-12-months">6-12 months</option>
                <option value="flexible">Flexible</option>
              </select>
            </div>
          </div>

          <div class="contact-form-element">
            <label for="subject">Project Title/Subject *</label>
            <input type="text" id="subject" name="subject" placeholder="Brief description of your project" required>
          </div>

          <div class="contact-form-element">
            <label for="message">Project Details *</label>
            <textarea id="message" name="body" placeholder="Tell us more about your project, goals, and any specific requirements..." required></textarea>
          </div>

          <input type="hidden" name="source" value="contact-form">
          <input type="hidden" name="category" value="project-inquiry">

          <button type="submit" class="submit-button">Send Project Inquiry</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 Ketner Lake. All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById('contactForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const messageDiv = document.getElementById('message');
      const submitButton = document.querySelector('.submit-button');
      
      // Show loading state
      submitButton.textContent = 'Sending...';
      submitButton.disabled = true;
      
      try {
        const formData = new FormData(this);
        const data = {};
        
        // Convert FormData to regular object
        for (let [key, value] of formData.entries()) {
          if (key === 'services[]') {
            if (!data.services) data.services = [];
            data.services.push(value);
          } else {
            data[key] = value;
          }
        }
        
        // Combine name fields for subject line
        const fullName = `${data.firstName} ${data.lastName}`;
        data.subject = `${data.subject} - ${fullName}`;
        
        // Add services to body if any selected
        if (data.services && data.services.length > 0) {
          data.body += `\n\nAdditional services requested: ${data.services.join(', ')}`;
        }
        
        // Add project details to body
        data.body += `\n\nProject Type: ${data.projectType}`;
        if (data.budget) data.body += `\nBudget: ${data.budget}`;
        if (data.timeline) data.body += `\nTimeline: ${data.timeline}`;
        if (data.company) data.body += `\nCompany: ${data.company}`;
        
        const response = await fetch('/api/message', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });
        
        if (response.ok) {
          messageDiv.textContent = 'Thank you! Your message has been sent successfully. We\'ll get back to you within 24 hours.';
          messageDiv.className = 'message success';
          messageDiv.style.display = 'block';
          this.reset();
        } else {
          throw new Error('Failed to send message');
        }
        
      } catch (error) {
        messageDiv.textContent = 'Sorry, there was an error sending your message. Please try again or contact us directly.';
        messageDiv.className = 'message error';
        messageDiv.style.display = 'block';
      }
      
      // Reset button
      submitButton.textContent = 'Send Project Inquiry';
      submitButton.disabled = false;
      
      // Scroll to message
      messageDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  </script>
</body>
</html>
